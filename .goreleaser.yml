version: 2
# GoReleaser configuration for Anklet pure-Go builds (CGO_ENABLED=0).
env:
- CGO_ENABLED=0
# Edge publishing uses `goreleaser release --snapshot`. Default snapshot versions look like
# `<last-tag>-SNAPSHOT-<commit>`; pin to `edge` so zip names and -X main.version match the release tag.
# Snapshot filenames omit the `v` prefix (anklet_edge_*) so they are not anklet_vedge_*.
snapshot:
  version_template: edge
before:
  hooks:
  - make go.lint
  - make go.test
builds:
- id: linux-amd64
  mod_timestamp: '{{ .CommitTimestamp }}'
  hooks:
    post:
    - cmd: bash -c "chmod +x {{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}"
      dir: "{{ dir .Path }}"
  flags:
  - -trimpath
  ldflags:
  - '-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}'
  goos:
  - linux
  goarch:
  - amd64
  binary: '{{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}'
  no_unique_dist_dir: true
- id: linux-arm64
  mod_timestamp: '{{ .CommitTimestamp }}'
  hooks:
    post:
    - cmd: bash -c "chmod +x {{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}"
      dir: "{{ dir .Path }}"
  flags:
  - -trimpath
  ldflags:
  - '-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}'
  goos:
  - linux
  goarch:
  - arm64
  binary: '{{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}'
  no_unique_dist_dir: true
- id: darwin-amd64
  mod_timestamp: '{{ .CommitTimestamp }}'
  hooks:
    post:
    - cmd: bash -c "chmod +x {{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}"
      dir: "{{ dir .Path }}"
  flags:
  - -trimpath
  ldflags:
  - '-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}'
  goos:
  - darwin
  goarch:
  - amd64
  binary: '{{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}'
  no_unique_dist_dir: true
- id: darwin-arm64
  mod_timestamp: '{{ .CommitTimestamp }}'
  hooks:
    post:
    - cmd: bash -c "chmod +x {{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}"
      dir: "{{ dir .Path }}"
  flags:
  - -trimpath
  ldflags:
  - '-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}'
  goos:
  - darwin
  goarch:
  - arm64
  binary: '{{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}'
  no_unique_dist_dir: true
archives:
  - formats: [ 'zip' ]
    files:
      - none*
    name_template: '{{ .ProjectName }}_{{ if .IsSnapshot }}{{ .Version }}{{ else }}v{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}'
release:
  disable: true
changelog:
  disable: true
