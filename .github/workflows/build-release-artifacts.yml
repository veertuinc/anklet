name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to checkout and build"
        required: true
        default: "edge"
        type: string
      full_release:
        description: "Publish full VERSION release (leave unchecked for rolling edge tag/release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - name: Check for GitHub App credentials
        id: app-check
        env:
          GOVULNCHECK_APP_ID: ${{ secrets.GOVULNCHECK_APP_ID }}
          GOVULNCHECK_APP_PRIVATE_KEY: ${{ secrets.GOVULNCHECK_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$GOVULNCHECK_APP_ID" ] && [ -n "$GOVULNCHECK_APP_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app-token
        if: steps.app-check.outputs.present == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GOVULNCHECK_APP_ID }}
          private-key: ${{ secrets.GOVULNCHECK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Tag from VERSION
        if: ${{ inputs.full_release }}
        run: git tag "$(cat VERSION)"

      - name: Delete existing edge release and tag
        if: ${{ !inputs.full_release }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          if gh release view edge >/dev/null 2>&1; then
            gh release delete edge --yes --cleanup-tag
          fi
          git push origin :refs/tags/edge 2>/dev/null || true
          git tag -d edge 2>/dev/null || true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
          cache: false

      - name: Run GoReleaser (VERSION)
        if: ${{ inputs.full_release }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean

      - name: Run GoReleaser (edge snapshot)
        if: ${{ !inputs.full_release }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean

      - name: Publish edge GitHub release
        if: ${{ !inputs.full_release }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          shopt -s nullglob
          assets=(dist/*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "ERROR: no zip artifacts found under dist/" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          gh release create edge \
            --title "edge" \
            --notes "Rolling edge build from \`${{ inputs.ref }}\` (\`${target_sha}\`)." \
            --prerelease \
            --target "${target_sha}" \
            "${assets[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-archive
          path: dist/*
          retention-days: 1
